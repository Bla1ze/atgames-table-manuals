<!doctype html>
<!-- Template for public/og-image.jpg (1200x630). Re-render with site/og/render.sh. -->
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=Inter:wght@500;600&display=swap" rel="stylesheet">
<style>
  * { margin: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body { position: relative; color: #f5f5f7; font-family: 'Inter', sans-serif;
    background: linear-gradient(115deg, rgba(228,0,43,.30), rgba(228,0,43,0) 52%),
                repeating-linear-gradient(115deg, rgba(255,255,255,.03) 0 2px, transparent 2px 16px), #08080a; }
  .bar { position: absolute; left: 0; right: 0; bottom: 0; height: 14px; background: #e4002b; }
  .text { position: absolute; left: 72px; top: 92px; width: 560px; }
  .tag { display: inline-block; background: #e4002b; color: #fff; font: 800 30px/1 'Barlow Condensed'; letter-spacing: .05em;
    text-transform: uppercase; padding: 8px 12px 6px; border-radius: 4px; transform: skewX(-8deg); }
  h1 { font: 800 136px/.86 'Barlow Condensed'; text-transform: uppercase; margin: 26px 0 26px -4px; }
  p { font-size: 28px; line-height: 1.35; color: #c9c9d1; font-weight: 500; }
  .url { position: absolute; left: 72px; bottom: 52px; font: 600 22px 'Inter'; color: #8b8b96; letter-spacing: .01em; }
  .fan { position: absolute; right: -10px; top: 40px; width: 560px; height: 560px; }
  .fan img { position: absolute; width: 250px; aspect-ratio: 210/297; object-fit: cover; object-position: top;
    border-radius: 8px; box-shadow: 0 22px 50px rgba(0,0,0,.65), 0 0 0 2px rgba(255,255,255,.08); }
</style></head><body>
  <div class="text">
    <span class="tag">AtGames</span>
    <h1>Table<br>Manuals</h1>
    <p>PDF user manuals for Legends pinball tables, with rules, modes and scoring.</p>
  </div>
  <div class="url">bla1ze.github.io/atgames-table-manuals</div>
  <div class="fan">
    <img src="../public/covers/zaccaria-locomotion-deluxe.webp" style="left:10px;top:120px;transform:rotate(-14deg)">
    <img src="../public/covers/zaccaria-magic-castle-deluxe.webp" style="left:110px;top:70px;transform:rotate(-6deg)">
    <img src="../public/covers/firefighter-urban.webp" style="left:290px;top:110px;transform:rotate(12deg)">
    <img src="../public/covers/zaccaria-future-world-deluxe.webp" style="left:200px;top:40px;transform:rotate(3deg)">
  </div>
  <div class="bar"></div>
</body></html>
